name: Alertas
on:
  # Cada hora lo dispara el cron del droplet (/root/disparar-alertas.sh, minuto 17):
  # el schedule de GitHub se atrasa y saltea corridas.
  push:                    # si cambian las reglas, publica el resumen en Slack
    branches: [main]
    paths: [clients.json]
  workflow_dispatch:
    inputs:
      modo:
        description: "normal | test (aviso de prueba) | reglas (publica qué alertas hay) | dry (solo loguea)"
        default: normal

permissions:
  contents: write

concurrency:
  group: alertas-${{ github.event_name }}   # push (reglas) no se pisa con las corridas cada 15 min
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: [self-hosted, zimba]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Chequear y avisar
        env:
          TZ: America/Argentina/Buenos_Aires
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: v25.0
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          MODO="${{ github.event.inputs.modo }}"
          [ "${{ github.event_name }}" = "push" ] && MODO=reglas
          case "$MODO" in
            reglas) node src/alerts.js --reglas ;;
            test) node src/alerts.js --test ;;
            dry)  node src/alerts.js --dry ;;
            *)    node src/alerts.js ;;
          esac
      - name: ¿Toca publicar estado? (una vez por hora, en la corrida de los :02)
        id: pub
        run: echo "si=$([ "$(date +%M)" -lt 15 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Publicar estado en el reporte
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'normal' && steps.pub.outputs.si == '1'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./alert-status
          destination_dir: data/alertas
          keep_files: true
          cname: reportes.zimba.com.ar
