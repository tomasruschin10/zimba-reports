name: Alertas
on:
  schedule:
    - cron: "17 * * * *"   # cada hora (UTC). Liviano: 2 llamadas por cuenta.
  workflow_dispatch:
    inputs:
      modo:
        description: "normal | test (manda un aviso de prueba) | dry (solo loguea)"
        default: normal

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: [self-hosted, zimba]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Chequear y avisar
        env:
          TZ: America/Argentina/Buenos_Aires
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: v25.0
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            test) node src/alerts.js --test ;;
            dry)  node src/alerts.js --dry ;;
            *)    node src/alerts.js ;;
          esac
