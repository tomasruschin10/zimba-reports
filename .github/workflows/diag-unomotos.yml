name: Diag UnoMotos (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: [self-hosted, zimba]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Correr y cifrar
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          node diag/unomotos.mjs > /tmp/out.json
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/out.json -out out.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey diag/pub.pem -in /tmp/k -out key.enc
          rm -f /tmp/out.json /tmp/k
          git config user.name zimba-bot; git config user.email bot@zimba.com.ar
          git checkout --orphan diag-out; git rm -rq --cached . ; git add -f out.enc key.enc; git commit -qm diag; git push -f origin diag-out
