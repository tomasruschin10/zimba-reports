name: Diag cron servidor
on:
  push:
    branches: [main]
    paths: [.github/workflows/diag-cron.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: [self-hosted, zimba]
    steps:
      - name: Relevar cron (sin secretos)
        run: |
          red() { sed -E 's/(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)/***/g; s/([Bb]earer|[Tt]oken[=: ]+)[^ "'"'"']+/\1 ***/g; s/[A-Za-z0-9_\-]{30,}/***/g'; }
          {
            echo "== whoami: $(whoami)  host: $(hostname)"
            echo "== crontab -l"; crontab -l 2>&1 | red
            echo "== /etc/cron.d"; ls -la /etc/cron.d 2>&1; for f in /etc/cron.d/*; do echo "-- $f"; cat "$f" 2>/dev/null | red; done
            echo "== scripts referenciados"
            for f in $(crontab -l 2>/dev/null | grep -oE '/[^ ]+\.(sh|mjs|js|py)' | sort -u); do echo "-- $f"; cat "$f" 2>/dev/null | red; done
            echo "== gh: $(command -v gh || echo no)"; gh auth status 2>&1 | red | head -5
            echo "== systemd timers"; systemctl list-timers --all 2>/dev/null | head -20
          } > /tmp/diag.txt 2>&1
          cd /tmp && rm -rf diagrepo && mkdir diagrepo && cd diagrepo && git init -q && cp /tmp/diag.txt . \
            && git -c user.name=bot -c user.email=bot@x add diag.txt && git -c user.name=bot -c user.email=bot@x commit -qm diag \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/diag-cron
