name: Build & Deploy reportes
on:
  schedule:
    # Respaldo por si falla cron-job.org: 10:40 UTC = 7:40 ART
    - cron: "40 10 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-reportes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Build estático
        env:
          TZ: America/Argentina/Buenos_Aires
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: v25.0
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          AGENCIA_PASSWORD: ${{ secrets.AGENCIA_PASSWORD }}
          TIENDANUBE_TOKEN_BACAN: ${{ secrets.TIENDANUBE_TOKEN_BACAN }}
          TIENDANUBE_TOKEN_CHILLOUT: ${{ secrets.TIENDANUBE_TOKEN_CHILLOUT }}
        run: npm run build
      - name: Deploy a gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
